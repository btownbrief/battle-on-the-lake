<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0e2238"/>
  <!-- dusk sun -->
  <circle cx="76" cy="22" r="9" fill="#f2a24a"/>
  <circle cx="76" cy="22" r="13" fill="#f2a24a" opacity="0.25"/>
  <!-- the ferry, steaming for the horizon -->
  <g>
    <path d="M10 42 L14 34 h30 l4 8 Z" fill="#f6efdc"/>
    <rect x="18" y="27" width="20" height="7" rx="2" fill="#d9ccae"/>
    <rect x="21" y="29" width="3.5" height="3" fill="#0e2238" opacity="0.55"/>
    <rect x="27" y="29" width="3.5" height="3" fill="#0e2238" opacity="0.55"/>
    <rect x="33" y="29" width="3.5" height="3" fill="#0e2238" opacity="0.55"/>
    <rect x="38" y="21" width="4" height="6" rx="1" fill="#d4553a"/>
  </g>
  <!-- water -->
  <path d="M2 46 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 v54 h-96 Z" fill="#123c5c"/>
  <!-- the calling grid, drawn on the lake -->
  <g stroke="#2a5f8a" stroke-width="1.6" opacity="0.95">
    <path d="M14 57 h72 M14 71 h72 M14 85 h72"/>
    <path d="M22 51 v42 M36 51 v42 M50 51 v42 M64 51 v42 M78 51 v42"/>
  </g>
  <!-- one miss -->
  <circle cx="29" cy="78" r="3.6" fill="#f6efdc" opacity="0.8"/>
  <!-- two hits, side by side -->
  <g stroke="#d4553a" stroke-width="4.5" stroke-linecap="round">
    <path d="M53 59.5 l8.5 8.5 M61.5 59.5 l-8.5 8.5"/>
    <path d="M67 59.5 l8.5 8.5 M75.5 59.5 l-8.5 8.5"/>
  </g>
</svg>
